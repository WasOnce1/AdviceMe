<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Today's Pulse — AdviceMe</title>
  <meta name="description" content="Real people sharing real advice. Join today's discussion on AdviceMe." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-deep: #0d0118; --purple-mid: #1a0535; --purple-glow: #4a0080;
      --pink: #e6008d; --pink-soft: #ff2bd6; --pink-pale: #ffb3f0;
      --white: #ffffff; --white-dim: rgba(255,255,255,0.6); --white-faint: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--purple-deep); color: var(--white); font-family: 'DM Sans', sans-serif; overflow-x: hidden; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(100px); animation: orbFloat linear infinite; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(74,0,128,0.4), transparent 70%); top: -150px; left: -100px; animation-duration: 20s; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(230,0,141,0.15), transparent 70%); bottom: 10%; right: -100px; animation-duration: 25s; animation-delay: -8s; }
    @keyframes orbFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.03); } }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 20px 60px; display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(13,1,24,0.95), transparent);
      backdrop-filter: blur(10px);
    }
    .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 1px; background: linear-gradient(135deg, #fff 30%, #ffb3f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
    .nav-right { display: flex; gap: 16px; align-items: center; }
    .nav-link { color: var(--white-dim); text-decoration: none; font-size: 14px; transition: color 0.2s; }
    .nav-link:hover { color: var(--white); }
    .nav-cta { padding: 9px 22px; border-radius: 30px; border: 1px solid rgba(255,43,214,0.5); background: rgba(255,43,214,0.08); color: var(--pink-soft); font-size: 14px; text-decoration: none; transition: all 0.3s; }
    .nav-cta:hover { background: rgba(255,43,214,0.2); color: #fff; }
    .page-wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 120px 32px 80px; }
    .page-eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,43,214,0.1); border: 1px solid rgba(255,43,214,0.25); border-radius: 30px; padding: 6px 16px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--pink-pale); margin-bottom: 24px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink-soft); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(36px, 6vw, 64px); font-weight: 300; line-height: 1.1; margin-bottom: 16px; }
    .page-title em { font-style: italic; background: linear-gradient(135deg, #ff2bd6, #e6008d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .question-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,43,214,0.2); border-radius: 24px; padding: 40px; margin-bottom: 32px; position: relative; overflow: hidden; }
    .question-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--pink-soft), transparent); }
    .question-meta { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--pink-soft); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .countdown { color: var(--pink-pale); font-size: 12px; letter-spacing: 1px; }
    .question-text { font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 4vw, 32px); font-weight: 300; font-style: italic; line-height: 1.4; color: rgba(255,255,255,0.9); margin-bottom: 28px; }
    .answer-count-tag { font-size: 13px; color: var(--white-dim); }
    .answer-count-tag span { color: var(--pink-pale); font-weight: 600; }
    .answer-form { margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 24px; }
    .answer-form textarea { width: 100%; min-height: 110px; padding: 16px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.7; resize: vertical; outline: none; transition: border-color 0.3s; letter-spacing: 0.2px; }
    .answer-form textarea:focus { border-color: rgba(255,43,214,0.5); background: rgba(255,43,214,0.03); }
    .answer-form textarea::placeholder { color: rgba(255,255,255,0.25); }
    .form-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 10px; }
    .char-count { font-size: 12px; color: var(--white-dim); }
    .submit-btn { padding: 12px 32px; border-radius: 30px; border: none; cursor: pointer; background: linear-gradient(135deg, #ff2bd6, #e6008d); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 30px rgba(230,0,141,0.35); }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(230,0,141,0.5); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .signup-prompt { background: rgba(255,43,214,0.06); border: 1px solid rgba(255,43,214,0.2); border-radius: 14px; padding: 20px 24px; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .signup-prompt p { font-size: 14px; color: var(--white-dim); }
    .signup-prompt a { padding: 10px 24px; border-radius: 30px; border: 1px solid rgba(255,43,214,0.5); background: rgba(255,43,214,0.1); color: var(--pink-soft); font-size: 14px; text-decoration: none; transition: all 0.2s; white-space: nowrap; }
    .signup-prompt a:hover { background: rgba(255,43,214,0.2); color: #fff; }
    .form-msg { padding: 12px 18px; border-radius: 12px; font-size: 13px; margin-top: 10px; display: none; }
    .form-msg.success { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); color: #00ff88; }
    .form-msg.error { background: rgba(255,51,85,0.08); border: 1px solid rgba(255,51,85,0.2); color: #ff3355; }
    .answers-section { margin-top: 40px; }
    .answers-header { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--white-dim); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .answers-header::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .answer-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 28px; margin-bottom: 16px; transition: all 0.3s; position: relative; }
    .answer-item:hover { background: rgba(255,43,214,0.04); border-color: rgba(255,43,214,0.15); }
    .answer-item.is-best { border-color: rgba(255,204,0,0.3); background: rgba(255,204,0,0.03); }
    .best-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,204,0,0.12); border: 1px solid rgba(255,204,0,0.3); border-radius: 20px; padding: 4px 12px; font-size: 11px; letter-spacing: 1px; color: #ffcc00; margin-bottom: 14px; }
    .answer-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,43,214,0.15); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; overflow: hidden; }
    .answer-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .answer-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .answer-user-info { flex: 1; }
    .answer-username { font-size: 14px; font-weight: 500; color: var(--white); }
    .answer-time { font-size: 12px; color: var(--white-dim); margin-top: 2px; }
    .answer-body { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.75; margin-bottom: 16px; font-weight: 300; }
    .answer-actions { display: flex; align-items: center; gap: 12px; }
    .like-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: var(--white-dim); font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .like-btn:hover { border-color: rgba(255,43,214,0.4); color: var(--pink-pale); }
    .like-btn.liked { border-color: rgba(255,43,214,0.4); color: var(--pink-soft); background: rgba(255,43,214,0.08); }
    .no-question { text-align: center; padding: 80px 40px; }
    .no-question-icon { font-size: 48px; margin-bottom: 20px; }
    .no-question h3 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; margin-bottom: 12px; color: rgba(255,255,255,0.7); }
    .no-question p { font-size: 15px; color: var(--white-dim); }
    .archive-section { margin-top: 60px; padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.06); }
    .archive-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; margin-bottom: 8px; }
    .archive-sub { font-size: 14px; color: var(--white-dim); margin-bottom: 28px; }
    .archive-item { display: flex; align-items: center; gap: 20px; padding: 20px 24px; border-radius: 16px; margin-bottom: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all 0.3s; text-decoration: none; }
    .archive-item:hover { background: rgba(255,43,214,0.04); border-color: rgba(255,43,214,0.15); transform: translateX(4px); }
    .archive-item-text { flex: 1; font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.5; font-style: italic; font-family: 'Cormorant Garamond', serif; }
    .archive-item-meta { text-align: right; flex-shrink: 0; }
    .archive-count { font-size: 20px; font-weight: 600; color: var(--pink-pale); display: block; font-family: 'Cormorant Garamond', serif; }
    .archive-date { font-size: 11px; color: var(--white-dim); letter-spacing: 1px; margin-top: 2px; }
    .archive-arrow { font-size: 18px; color: rgba(255,255,255,0.2); }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--white-dim); font-size: 14px; cursor: pointer; margin-bottom: 32px; transition: color 0.2s; background: none; border: none; padding: 0; }
    .back-btn:hover { color: var(--white); }
    .loading-state { text-align: center; padding: 60px 20px; color: var(--white-dim); font-size: 14px; }
    .spinner { width: 30px; height: 30px; border: 2px solid rgba(255,43,214,0.2); border-top-color: var(--pink-soft); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { position: relative; z-index: 1; padding: 32px 60px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 60px; }
    .footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: rgba(255,255,255,0.4); }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { font-size: 13px; color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: rgba(255,255,255,0.7); }
    @media (max-width: 640px) {
      nav { padding: 16px 20px; }
      .page-wrap { padding: 100px 20px 60px; }
      .question-card { padding: 24px; }
      footer { padding: 24px 20px; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<nav>
  <a href="index.html" class="nav-brand">AdviceMe</a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Home</a>
    <a href="login.html?redirect=discuss" class="nav-cta">Sign In</a>
  </div>
</nav>

<div class="page-wrap" id="mainView">
  <div class="page-eyebrow"><div class="live-dot"></div> Today's Pulse</div>
  <h1 class="page-title">Real questions.<br/><em>Real answers.</em></h1>

  <div id="pulseContent">
    <div class="loading-state"><div class="spinner"></div>Loading today's discussion...</div>
  </div>

  <div class="archive-section" id="archiveSection" style="display:none;">
    <h2 class="archive-title">Past Discussions</h2>
    <p class="archive-sub">Browse real conversations from our community</p>
    <div id="archiveList"></div>
  </div>
</div>

<footer>
  <div class="footer-brand">AdviceMe</div>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="login.html?redirect=discuss">Sign In</a>
    <a href="login.html?redirect=discuss">Sign Up</a>
  </div>
</footer>

<script>
  const API   = "https://api.adviceme.social/api/pulse";
  const token = localStorage.getItem("token");

  // ✅ FIX: isLoggedIn based purely on token — no profile needed to answer
  const isLoggedIn = !!token;

  let myUsername     = null;  // used only for "already answered" check
  let myLikedAnswers = [];
  let currentQuestionId = null;

  async function init() {
    // Try to get username for duplicate-answer detection
    // Even if this fails, isLoggedIn stays true and user can still answer
    if (token) {
      try {
        const res = await fetch("https://api.adviceme.social/api/profile/me", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const profile = await res.json();
          myUsername = profile.username || null;
        }
      } catch(e) {}

      // Fallback: decode token to get username/id
      if (!myUsername) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          myUsername = payload.username || `anon_${payload.id}`;
        } catch(e) {}
      }
    }

    await loadActiveQuestion();
    await loadArchive();
  }

  async function loadActiveQuestion() {
    try {
      const res = await fetch(`${API}/active`);
      const { question, answers } = await res.json();
      currentQuestionId = question?.id || null;

      // Only fetch likes if logged in and question exists
      if (isLoggedIn && question) {
        const lRes = await fetch(`${API}/mylikes/${question.id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (lRes.ok) myLikedAnswers = await lRes.json();
      }

      renderActiveQuestion(question, answers);
    } catch(e) {
      document.getElementById("pulseContent").innerHTML = `
        <div class="no-question">
          <div class="no-question-icon">🌙</div>
          <h3>No active discussion yet</h3>
          <p>Check back soon — a new question drops every day.</p>
        </div>`;
    }
  }

  function renderActiveQuestion(question, answers) {
    const el = document.getElementById("pulseContent");

    if (!question) {
      el.innerHTML = `
        <div class="no-question">
          <div class="no-question-icon">🌙</div>
          <h3>No active discussion today</h3>
          <p>Check back soon — a new question drops every day.</p>
        </div>`;
      return;
    }

    const expiresAt = new Date(question.expires_at);
    const msLeft    = expiresAt - Date.now();
    const hoursLeft = Math.max(0, Math.floor(msLeft / 3600000));
    const minsLeft  = Math.max(0, Math.floor((msLeft % 3600000) / 60000));

    // ✅ FIX: check answered using myUsername, but only block if we actually know their username
    const answeredAlready = isLoggedIn && myUsername &&
      answers.some(a => a.username === myUsername);

    el.innerHTML = `
      <div class="question-card">
        <div class="question-meta">
          <div class="live-dot"></div> Live Now
          <span class="countdown">· Closes in ${hoursLeft}h ${minsLeft}m</span>
        </div>
        <div class="question-text">"${question.question_text}"</div>
        <div class="answer-count-tag">
          <span>${answers.length}</span> ${answers.length === 1 ? 'person has' : 'people have'} shared their story
        </div>

        ${isLoggedIn
          ? answeredAlready
            ? `<div class="form-msg success" style="display:block;margin-top:20px;">
                ✓ You've already shared your story today. Come back tomorrow!
               </div>`
            : `<div class="answer-form">
                <textarea id="answerText"
                  placeholder="Share your honest answer... What helped you? What do you wish someone had told you?"
                  maxlength="800" oninput="updateCount(this)"></textarea>
                <div class="form-footer">
                  <span class="char-count" id="charCount">0 / 800</span>
                  <button class="submit-btn" onclick="submitAnswer(${question.id})">Share My Story</button>
                </div>
                <div class="form-msg" id="answerMsg"></div>
              </div>`
          : `<div class="signup-prompt">
              <p>Sign up to share your story and help others.</p>
              <a href="login.html?redirect=discuss">Join the Discussion →</a>
            </div>`
        }
      </div>

      <div class="answers-section">
        <div class="answers-header">Community Answers</div>
        ${answers.length === 0
          ? `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:15px;">
               Be the first to answer today's question ✨
             </div>`
          : answers.map(a => renderAnswerItem(a)).join("")
        }
      </div>
    `;
  }

  function renderAnswerItem(a) {
    const liked      = myLikedAnswers.includes(a.id);
    const avatarHtml = a.profile_image_url
      ? `<img src="${a.profile_image_url}" alt="${a.username}" />`
      : `<span>${a.username?.charAt(0)?.toUpperCase() || '?'}</span>`;
    const timeAgo    = formatTimeAgo(new Date(a.created_at));

    return `
      <div class="answer-item ${a.is_best ? 'is-best' : ''}" id="answer-${a.id}">
        ${a.is_best ? `<div class="best-badge">🏆 Best Advice of the Day</div>` : ''}
        <div class="answer-top">
          <div class="answer-avatar">${avatarHtml}</div>
          <div class="answer-user-info">
            <div class="answer-username">${a.username}</div>
            <div class="answer-time">${timeAgo}</div>
          </div>
        </div>
        <div class="answer-body">${escapeHtml(a.answer_text)}</div>
        <div class="answer-actions">
          ${isLoggedIn
            ? `<button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(${a.id}, this)">
                 ${liked ? '♥' : '♡'} <span class="like-count">${a.likes}</span>
               </button>`
            : `<span style="font-size:13px;color:rgba(255,255,255,0.25);">
                 ♡ ${a.likes} ${a.likes === 1 ? 'like' : 'likes'}
               </span>`
          }
        </div>
      </div>
    `;
  }

  function updateCount(el) {
    document.getElementById("charCount").innerText = `${el.value.length} / 800`;
  }

  async function submitAnswer(questionId) {
    const text = document.getElementById("answerText")?.value?.trim();
    const msg  = document.getElementById("answerMsg");
    if (!text)            { showMsg(msg, "error", "Please write something first!"); return; }
    if (text.length < 10) { showMsg(msg, "error", "Answer is too short — share a bit more!"); return; }

    const btn     = document.querySelector(".submit-btn");
    btn.disabled  = true;
    btn.innerText = "Sharing...";

    try {
      const res = await fetch(`${API}/answer`, {
        method:  "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body:    JSON.stringify({ question_id: questionId, answer_text: text })
      });
      const data = await res.json();
      if (res.ok) {
        showMsg(msg, "success", "✓ Your story has been shared!");

        // ✅ For non-anonymous public users — show "experience the full app" prompt
        // They signed up via discuss so haven't completed their full profile yet
        try {
          const profileRes = await fetch("https://api.adviceme.social/api/profile/me", {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (profileRes.ok) {
            const profile = await profileRes.json();
            const isIncomplete = !profile.bio || !profile.expertise;
            const isPublic = profile.username && !profile.username.startsWith("anon_");

            if (isPublic && isIncomplete) {
              setTimeout(() => {
                const formEl = document.querySelector(".answer-form");
                if (formEl) {
                  formEl.innerHTML = `
                    <div style="margin-top:20px;padding:24px;background:rgba(255,43,214,0.05);border:1px solid rgba(255,43,214,0.18);border-radius:16px;">
                      <p style="font-size:15px;font-weight:500;color:rgba(255,255,255,0.9);margin-bottom:8px;">Your story is live ✨</p>
                      <p style="font-size:13px;color:rgba(255,255,255,0.45);line-height:1.7;margin-bottom:16px;">
                        To View Your Story, Connect With Real People Or Experience The Full AdviceMe App?
                        Use the same credentials you just signed up with.
                      </p>
                      <a href="create-profile.html?redirect=discuss"
                         style="display:inline-block;padding:11px 28px;border-radius:30px;border:1px solid rgba(255,43,214,0.4);background:rgba(255,43,214,0.1);color:#ff2bd6;font-size:13px;font-weight:500;text-decoration:none;letter-spacing:0.3px;">
                        Complete Your Profile →
                      </a>
                    </div>`;
                }
              }, 1600);
            } else {
              setTimeout(() => loadActiveQuestion(), 1500);
            }
          } else {
            setTimeout(() => loadActiveQuestion(), 1500);
          }
        } catch(e) {
          setTimeout(() => loadActiveQuestion(), 1500);
        }
      } else {
        showMsg(msg, "error", data.message);
        btn.disabled  = false;
        btn.innerText = "Share My Story";
      }
    } catch(e) {
      showMsg(msg, "error", "Something went wrong. Try again.");
      btn.disabled  = false;
      btn.innerText = "Share My Story";
    }
  }

  async function toggleLike(answerId, btn) {
    if (!isLoggedIn) { window.location.href = "login.html?redirect=discuss"; return; }
    const isLiked  = btn.classList.contains("liked");
    const countEl  = btn.querySelector(".like-count");
    const newCount = isLiked ? parseInt(countEl.innerText) - 1 : parseInt(countEl.innerText) + 1;
    btn.innerHTML  = `${isLiked ? '♡' : '♥'} <span class="like-count">${newCount}</span>`;
    isLiked ? btn.classList.remove("liked") : btn.classList.add("liked");
    try {
      await fetch(`${API}/like/${answerId}`, {
        method: "POST", headers: { Authorization: `Bearer ${token}` }
      });
    } catch(e) {}
  }

  async function loadArchive() {
    try {
      const res  = await fetch(`${API}/archive`);
      const data = await res.json();
      const section = document.getElementById("archiveSection");
      const list    = document.getElementById("archiveList");
      if (!data.length) { section.style.display = "none"; return; }
      section.style.display = "block";
      list.innerHTML = data.map(q => `
        <div class="archive-item" onclick="loadArchivedQuestion('${q.question_slug}', '${escapeHtml(q.question_text)}')">
          <div class="archive-item-text">"${escapeHtml(q.question_text)}"</div>
          <div class="archive-item-meta">
            <span class="archive-count">${q.answer_count}</span>
            <div class="archive-date">${new Date(q.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
          </div>
          <span class="archive-arrow">→</span>
        </div>
      `).join("");
    } catch(e) {}
  }

  async function loadArchivedQuestion(slug, questionText) {
    const el = document.getElementById("pulseContent");
    el.innerHTML = `<div class="loading-state"><div class="spinner"></div>Loading discussion...</div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    try {
      const res = await fetch(`${API}/archive/${slug}`);
      const { question, answers } = await res.json();
      el.innerHTML = `
        <button class="back-btn" onclick="loadActiveQuestion(); loadArchive();">← Back to Today</button>
        <div class="question-card">
          <div class="question-meta">Archived · ${new Date(question.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
          <div class="question-text">"${question.question_text}"</div>
          <div class="answer-count-tag">
            <span>${answers.length}</span> ${answers.length === 1 ? 'person shared their story' : 'people shared their stories'}
          </div>
        </div>
        <div class="answers-section">
          <div class="answers-header">Community Answers</div>
          ${answers.length === 0
            ? `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">No answers were shared for this question.</div>`
            : answers.map(a => renderAnswerItem(a)).join("")
          }
        </div>
      `;
    } catch(e) {
      el.innerHTML = `<div class="no-question"><div class="no-question-icon">😕</div><h3>Couldn't load this discussion</h3></div>`;
    }
  }

  function showMsg(el, type, text) {
    el.className     = `form-msg ${type}`;
    el.style.display = "block";
    el.innerText     = text;
    if (type === "success") setTimeout(() => el.style.display = "none", 4000);
  }

  function formatTimeAgo(date) {
    const diff = Date.now() - date;
    const mins = Math.floor(diff / 60000);
    if (mins < 1)  return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)  return `${hrs}h ago`;
    return date.toLocaleDateString();
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
